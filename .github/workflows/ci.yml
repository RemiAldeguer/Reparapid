name: Vérification de l’application

on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Tests métier, authentification et compilation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Récupérer les sources
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer les dépendances
        run: npm ci
      - name: Tests métier et sécurité de l’API
        run: npm test
      - name: Vérifier les types et compiler l’interface
        run: npm run build
      - name: Conserver l’interface compilée (serveur requis)
        uses: actions/upload-artifact@v4
        with:
          name: reparapid-admin-interface
          path: dist/
          if-no-files-found: error
          retention-days: 14
